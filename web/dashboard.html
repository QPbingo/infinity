<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Monitor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; }

/* Layout */
#app { display: flex; height: 100vh; }
#sidebar { width: 260px; background: #161b22; border-right: 1px solid #21262d; display: flex; flex-direction: column; overflow: hidden; }
#main { flex: 1; overflow-y: auto; padding: 20px; }
.sidebar-header { padding: 12px 14px; border-bottom: 1px solid #21262d; display: flex; align-items: center; justify-content: space-between; }
.sidebar-header h2 { font-size: 0.9em; color: #58a6ff; }
.sidebar-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.sidebar-footer { padding: 8px 14px; border-top: 1px solid #21262d; font-size: 0.72em; color: #8b949e; }

/* Tree nodes */
.tree-node { user-select: none; }
.tree-row { display: flex; align-items: center; padding: 3px 14px; cursor: pointer; gap: 4px; font-size: 0.78em; }
.tree-row:hover { background: #1c2128; }
.tree-row.selected { background: #1f2a3d; }
.tree-arrow { font-size: 0.55em; width: 10px; color: #8b949e; transition: transform 0.12s; }
.tree-arrow.open { transform: rotate(90deg); }
.tree-icon { font-size: 0.85em; }
.tree-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tree-children { display: none; padding-left: 12px; }
.tree-children.open { display: block; }
.tree-badge { font-size: 0.65em; color: #8b949e; background: #21262d; padding: 0 4px; border-radius: 3px; }
.tree-add { font-size: 0.7em; color: #58a6ff; cursor: pointer; visibility: hidden; padding: 0 3px; }
.tree-row:hover .tree-add { visibility: visible; }
.tree-add:hover { color: #79c0ff; }

/* Top bar */
#topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #21262d; }
#topbar h1 { font-size: 1.1em; color: #58a6ff; }
#topbar .meta { font-size: 0.75em; color: #8b949e; }
#topbar .user-area { display: flex; align-items: center; gap: 10px; font-size: 0.78em; }
#topbar .user-area button { padding: 3px 10px; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; font-size: 0.85em; }

/* Auth */
#auth-overlay { position: fixed; inset: 0; background: #0d1117; display: flex; align-items: center; justify-content: center; z-index: 100; }
.auth-box { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 28px 24px; width: 340px; }
.auth-box h2 { font-size: 1em; color: #58a6ff; margin-bottom: 16px; }
.auth-box input { width: 100%; padding: 8px 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 0.85em; margin-bottom: 8px; }
.auth-box button { width: 100%; padding: 8px; background: #238636; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
.auth-box button:hover { background: #2ea043; }
.auth-box .switch { text-align: center; margin-top: 10px; font-size: 0.75em; color: #8b949e; }
.auth-box .switch a { color: #58a6ff; cursor: pointer; }
.auth-box .error { color: #f85149; font-size: 0.75em; margin-bottom: 8px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 200; }
.modal-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; width: 360px; }
.modal-box h3 { font-size: 0.9em; color: #e6edf3; margin-bottom: 12px; }
.modal-box input, .modal-box textarea { width: 100%; padding: 6px 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 0.82em; margin-bottom: 8px; resize: vertical; }
.modal-box .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal-box .modal-actions button { padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 0.78em; border: none; }
.modal-box .btn-primary { background: #238636; color: white; }
.modal-box .btn-cancel { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }

/* Inline create */
.inline-form { padding: 2px 14px 2px 20px; display: none; }
.inline-form.show { display: flex; gap: 4px; }
.inline-form input { flex: 1; padding: 2px 6px; background: #0d1117; border: 1px solid #30363d; border-radius: 3px; color: #c9d1d9; font-size: 0.72em; }
.inline-form button { padding: 1px 8px; background: #238636; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 0.7em; }

/* Session cards (reused) */
.filters { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
.filter-btn { padding: 3px 9px; border: 1px solid #30363d; background: #161b22; color: #8b949e; border-radius: 4px; cursor: pointer; font-size: 0.76em; }
.filter-btn.active { background: #1f6feb; border-color: #1f6feb; color: white; }
.session-card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.card-header { display: flex; align-items: center; padding: 8px 12px; cursor: pointer; gap: 8px; height: 36px; overflow: hidden; }
.card-header:hover { background: #1c2128; }
.card-agent { font-weight: 600; font-size: 0.78em; color: #58a6ff; white-space: nowrap; }
.card-title { font-size: 0.82em; color: #e6edf3; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta { display: flex; gap: 6px; font-size: 0.68em; color: #8b949e; align-items: center; white-space: nowrap; }
.badge { padding: 1px 7px; border-radius: 9px; font-size: 0.78em; font-weight: 500; }
.badge-active { background: #238636; color: white; }
.badge-idle { background: #9e6a03; color: white; }
.badge-stopped { background: #484f58; color: white; }
.badge-disappeared { background: #da3633; color: white; }
.badge-unknown,.badge-error { background: #da3633; color: white; }
.badge-event { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
.card-body { display: none; border-top: 1px solid #21262d; padding: 12px 14px 14px; background: #0d1117; }
.card-body.open { display: block; }
.block { margin-bottom: 10px; }
.block-label { font-size: 0.68em; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 6px 10px; font-size: 0.78em; }
.info-item { display: flex; gap: 4px; }
.info-key { color: #8b949e; }
.info-val { color: #c9d1d9; font-family: 'SF Mono', monospace; font-size: 0.9em; }
.empty-state { text-align: center; padding: 50px; color: #484f58; }

/* Timeline */
.timeline { margin-top: 6px; }
.tl-turn { margin-bottom: 14px; border: 1px solid #21262d; border-radius: 6px; overflow: hidden; }
.tl-turn-header { display: flex; align-items: center; padding: 6px 10px; background: #1c2128; gap: 8px; font-size: 0.75em; color: #8b949e; border-bottom: 1px solid #21262d; cursor: pointer; }
.tl-turn-body { display: none; }
.tl-turn-body.open { display: block; }
.tl-turn-badge { color: #58a6ff; font-weight: 600; }
.tl-entry { padding: 8px 12px; border-bottom: 1px solid #21262d; }
.tl-entry:last-child { border-bottom: none; }
.tl-entry-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.tl-label { font-size: 0.68em; color: #8b949e; text-transform: uppercase; }
.tl-time { font-size: 0.65em; color: #484f58; margin-left: auto; font-family: 'SF Mono', monospace; }
.tl-text { font-size: 0.8em; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
.tl-user-text { font-size: 0.82em; white-space: pre-wrap; word-break: break-word; line-height: 1.5; color: #e6edf3; background: #1a2332; padding: 8px 12px; border-radius: 4px; margin-top: 2px; }
.tl-arrow { font-size: 0.6em; transition: transform 0.15s; display: inline-block; }
.tl-arrow.open { transform: rotate(90deg); }
.tl-tool-count { font-size: 0.68em; color: #8b949e; }
.tl-tool-group-header { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.tl-tool-group-header:hover { opacity: 0.85; }
.tl-tools { display: none; margin-top: 6px; }
.tl-tools.open { display: block; }
.tl-tool { background: #010409; border: 1px solid #21262d; border-radius: 4px; padding: 6px 10px; margin-bottom: 4px; }
.tl-tool-head { display: flex; align-items: center; gap: 8px; font-size: 0.72em; }
.tl-tool-name { color: #d2a8ff; font-weight: 600; font-family: 'SF Mono', monospace; }
.tl-tool-status { font-size: 0.85em; padding: 0 4px; border-radius: 3px; }
.tl-tool-status.running { background: #9e6a03; color: #d29922; }
.tl-tool-status.completed { background: #1a3a1a; color: #3fb950; }
.tl-tool-status.error { background: #3a1a1a; color: #f85149; }
.tl-tool-input, .tl-tool-output { font-size: 0.7em; color: #8b949e; font-family: 'SF Mono', monospace; margin-top: 2px; white-space: pre-wrap; word-break: break-all; max-height: 60px; overflow: auto; }
.tl-payload-toggle { display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; padding: 2px 0; margin-top: 4px; font-size: 0.68em; color: #8b949e; }
.tl-payload-toggle:hover { color: #c9d1d9; }
.tl-payload-body { display: none; margin-top: 4px; background: #010409; border: 1px solid #21262d; border-radius: 4px; padding: 8px 10px; }
.tl-payload-body.open { display: block; }
.tl-payload-body pre { margin: 0; font-size: 0.7em; color: #7d8590; max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: 'SF Mono', monospace; }
.web-input-row { display: flex; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid #21262d; }
.web-input-row input { flex: 1; padding: 5px 8px; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 0.78em; }
.web-input-row button { padding: 4px 10px; background: #1f6feb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.75em; }
</style>
</head>
<body>

<!-- Auth overlay -->
<div id="auth-overlay"><div class="auth-box" id="auth-box"></div></div>

<!-- App (hidden until authenticated) -->
<div id="app" style="display:none">
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Agent Monitor</h2>
      <span style="font-size:0.7em;color:#8b949e;cursor:pointer" onclick="showCreateModal('project',selectedWorkspaceId)" title="New project">+</span>
    </div>
    <div class="sidebar-body" id="tree"></div>
    <div class="sidebar-footer">
      <div id="ws-selector">
        <select id="ws-select" onchange="switchWorkspace(parseInt(this.value))" style="width:100%;padding:3px 4px;background:#0d1117;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:0.7em;margin-bottom:4px"></select>
        <button onclick="showCreateModal('workspace',0)" style="width:100%;padding:2px;background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:3px;cursor:pointer;font-size:0.68em">+ New Workspace</button>
      </div>
      <span id="sess-count" style="display:block;margin-top:6px">0 sessions</span>
    </div>
  </div>
  <div id="main">
    <div id="topbar">
      <div>
        <h1 id="page-title">All Sessions</h1>
        <span class="meta" id="page-meta"></span>
      </div>
      <div class="user-area">
        <span id="user-name"></span>
        <button onclick="logout()">Logout</button>
      </div>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="idle">Idle</button>
      <button class="filter-btn" data-filter="stopped">Stopped</button>
    </div>
    <div id="agent-panel" style="background:#161b22;border:1px solid #21262d;border-radius:8px;margin-bottom:14px;overflow:hidden">
      <div id="agent-panel-header" onclick="toggleAgentPanel()" style="padding:8px 12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:#1c2128">
        <span style="font-size:0.8em;color:#58a6ff">Agent Control</span>
        <span style="font-size:0.6em;color:#8b949e" id="agent-panel-arrow">▼</span>
      </div>
      <div id="agent-panel-body" style="display:none;padding:10px 12px">
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <select id="agent-select" style="flex:1;padding:4px;background:#0d1117;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:0.76em">
            <option value="claude">Claude Code</option>
            <option value="opencode">OpenCode</option>
            <option value="codex">Codex</option>
          </select>
          <input id="agent-session-id" placeholder="Session ID (optional)" style="flex:1;padding:4px;background:#0d1117;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:0.76em">
          <select id="agent-perm-mode" style="padding:4px;background:#0d1117;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:0.7em">
            <option value="">default</option>
            <option value="acceptEdits">acceptEdits</option>
            <option value="bypassPermissions">bypass</option>
            <option value="plan">plan</option>
            <option value="readOnly">readOnly</option>
          </select>
          <select id="agent-timeout" style="padding:4px;background:#0d1117;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:0.7em" title="Timeout">
            <option value="5">5m</option>
            <option value="10" selected>10m</option>
            <option value="30">30m</option>
            <option value="60">1h</option>
            <option value="120">2h</option>
          </select>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <textarea id="agent-prompt" rows="2" placeholder="Enter prompt..." style="flex:1;padding:6px 8px;background:#0d1117;border:1px solid #30363d;border-radius:4px;color:#c9d1d9;font-size:0.78em;resize:vertical"></textarea>
        </div>
        <div style="display:flex;gap:6px">
          <button onclick="sendAgentPrompt()" style="padding:5px 14px;background:#238636;color:white;border:none;border-radius:4px;cursor:pointer;font-size:0.76em">Send</button>
          <button onclick="cancelAgent()" style="padding:5px 10px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;cursor:pointer;font-size:0.72em">Cancel</button>
          <span id="agent-status" style="font-size:0.7em;color:#8b949e;align-self:center"></span>
        </div>
        <div id="agent-output" style="margin-top:8px;max-height:200px;overflow-y:auto;background:#0d1117;border:1px solid #21262d;border-radius:4px;padding:8px;font-size:0.72em;font-family:'SF Mono',monospace;white-space:pre-wrap;word-break:break-word;display:none"></div>
      </div>
    </div>
    <div id="cards-container"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
// ── State ──
let ws = null;
let sessions = {};
let hierarchy = null;
let bearerToken = '';
let currentUser = null;
let currentFilter = 'all';
let selectedWorkspaceId = 1; // default to Inspiration
let selectedTopicId = null;
let executionHistory = [];
let currentExecId = null;
let selectedTopicName = '';
let selectedStoryId = null;
let expandedCards = {};
let expandedToolGroups = {};
let expandedPayloads = {};
let expandedTurns = {};
let expandedNodes = {}; // sidebar tree expansion

// ── Auth ──
function renderAuth(mode) {
  const isLogin = mode === 'login';
  document.getElementById('auth-box').innerHTML = `
    <h2>${isLogin ? 'Sign In' : 'Create Account'}</h2>
    <div class="error" id="auth-error" style="display:none"></div>
    <input type="text" id="auth-username" placeholder="Username" autocomplete="username">
    <input type="password" id="auth-password" placeholder="Password" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
    ${!isLogin ? '<input type="password" id="auth-password2" placeholder="Confirm password">' : ''}
    <button onclick="${isLogin ? 'doLogin()' : 'doRegister()'}">${isLogin ? 'Sign In' : 'Create Account'}</button>
    <div class="switch">
      ${isLogin ? "Don't have an account? <a onclick='renderAuth(\"register\")'>Sign up</a>" : "Already have an account? <a onclick='renderAuth(\"login\")'>Sign in</a>"}
    </div>
  `;
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function doRegister() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  const password2 = document.getElementById('auth-password2').value;
  if (!username || !password) { showError('Username and password required'); return; }
  if (password !== password2) { showError('Passwords do not match'); return; }

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error); return; }
    onAuthSuccess(data);
  } catch (e) { showError('Connection failed'); }
}

async function doLogin() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!username || !password) { showError('Username and password required'); return; }

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || 'Invalid credentials'); return; }
    onAuthSuccess(data);
  } catch (e) { showError('Connection failed'); }
}

function onAuthSuccess(data) {
  bearerToken = data.token;
  currentUser = data.user;
  localStorage.setItem('bearer_token', bearerToken);
  localStorage.setItem('current_user', JSON.stringify(currentUser));
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-name').textContent = currentUser.username;
  connectWS();
}

function logout() {
  if (bearerToken) {
    fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + bearerToken } }).catch(() => {});
  }
  localStorage.removeItem('bearer_token');
  localStorage.removeItem('current_user');
  bearerToken = '';
  currentUser = null;
  if (ws) ws.close();
  ws = null;
  sessions = {};
  hierarchy = null;
  renderAuth('login');
}

// ── WebSocket ──
function connectWS() {
  if (ws) ws.close();
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => ws.send(JSON.stringify({ type: 'auth', token: bearerToken }));
  ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
  ws.onclose = () => { if (bearerToken) setTimeout(connectWS, 3000); };
}

function handleMessage(msg) {
  switch (msg.type) {
    case 'auth_ok': break;
    case 'auth_error': logout(); return;
    case 'snapshot': sessions = {}; msg.sessions.forEach(s => { sessions[s.session_key] = s; }); render(); break;
    case 'session_added': sessions[msg.session.session_key] = msg.session; render(); break;
    case 'delta': if (sessions[msg.session_key]) { Object.assign(sessions[msg.session_key], msg.changes); render(); } break;
    case 'hierarchy_snapshot': hierarchy = msg.hierarchy; renderTree(); break;
    case 'hierarchy_updated': hierarchy = msg.hierarchy; renderTree(); render(); break;
    case 'agent_executions':
      // Full execution history on reconnect
      executionHistory = msg.executions || [];
      renderExecHistory();
      break;
    case 'agent_exec_started':
      // New execution started (from any client)
      if (!executionHistory.find(e => e.id === msg.exec_id)) {
        executionHistory.unshift({ id: msg.exec_id, agent_type: msg.agent_type, session_id: msg.session_id, prompt: msg.prompt, status: 'running', messages: [], created_at: new Date().toISOString() });
      }
      renderExecHistory();
      break;
    case 'agent_session_created': case 'agent_error': case 'agent_message':
      handleAgentMessage(msg); break;
  }
}

// ── Sidebar Tree ──
function renderTree() {
  if (!hierarchy || !hierarchy.workspaces) return;

  // Populate workspace selector
  const sel = document.getElementById('ws-select');
  if (sel) {
    sel.innerHTML = hierarchy.workspaces.map(ws =>
      '<option value="' + ws.workspace.id + '"' + (ws.workspace.id === selectedWorkspaceId ? ' selected' : '') + '>' + esc(ws.workspace.name) + '</option>'
    ).join('');
  }

  // Render only the selected workspace's tree
  const ws = hierarchy.workspaces.find(w => w.workspace.id === selectedWorkspaceId);
  if (!ws) { document.getElementById('tree').innerHTML = ''; return; }

  const wsId = 'ws_' + ws.workspace.id;
  const wsOpen = expandedNodes[wsId] !== false; // default open
  let html = '<div class="tree-node">';
  html += '<div class="tree-row" onclick="toggleNode(\'' + wsId + '\')">';
  html += '<span class="tree-arrow' + (wsOpen ? ' open' : '') + '">▶</span>';
  html += '<span class="tree-icon">📁</span>';
  html += '<span class="tree-name" title="' + esc(ws.workspace.name) + '">' + esc(ws.workspace.name) + '</span>';
  html += '<span class="tree-add" onclick="event.stopPropagation();showPermissionModal(\'workspace\',' + ws.workspace.id + ')" title="Permissions">👥</span>';
  html += '</div>';
  html += '<div class="tree-children' + (wsOpen ? ' open' : '') + '" id="' + wsId + '">';
  if (ws.projects) {
    ws.projects.forEach(proj => {
      html += renderProjectNode(proj, ws.workspace.id);
    });
  }
  html += '</div></div>';
  document.getElementById('tree').innerHTML = html;

  // Update header "+" to use selected workspace
  const headerAdd = document.querySelector('.sidebar-header span');

      <select id="perm-user-select" style="flex:1;padding:4px;background:#0d1117;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:0.78em"></select>
      <select id="perm-level-select" style="padding:4px;background:#0d1117;border:1px solid #30363d;border-radius:3px;color:#c9d1d9;font-size:0.78em">
        <option value="100">Admin</option>
        <option value="10">Viewer</option>
      </select>

async function loadPermissions(type, id) {
  try {
    const res = await fetch('/api/permissions/' + type + '/' + id, { headers: { 'Authorization': 'Bearer ' + bearerToken } });
    if (!res.ok) return;
    const perms = await res.json();
    let html = '';
    if (perms.length === 0) html = '<div style="color:#8b949e">No permissions set</div>';
    else {
      perms.forEach(p => {
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid #21262d">';
        html += '<span>User #' + p.user_id + ' <span style="color:#8b949e">(' + (p.level >= 100 ? 'Admin' : 'Viewer') + ')</span></span>';
        html += '<button onclick="removePermission(\'' + type + '\',' + id + ',' + p.user_id + ')" style="background:none;border:none;color:#f85149;cursor:pointer;font-size:0.8em">✕</button>';
        html += '</div>';
      });
    }
    document.getElementById('perm-list').innerHTML = html;
  } catch (e) {}
}

async function loadUsersForSelect() {
  try {
    const res = await fetch('/api/users', { headers: { 'Authorization': 'Bearer ' + bearerToken } });
    if (!res.ok) return;
    const users = await res.json();
    const sel = document.getElementById('perm-user-select');
    if (!sel) return;
    sel.innerHTML = users.map(u => '<option value="' + u.id + '">' + esc(u.username) + '</option>').join('');
  } catch (e) {}
}

async function addPermission(type, id) {
  const uid = parseInt(document.getElementById('perm-user-select')?.value);
  const level = parseInt(document.getElementById('perm-level-select')?.value);
  if (!uid) return;
  try {
    await fetch('/api/permissions/' + type + '/' + id, {
      method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + bearerToken },
      body: JSON.stringify({ user_id: uid, level: level })
    });
    loadPermissions(type, id);
  } catch (e) {}
}

async function removePermission(type, rid, uid) {
  try {
    await fetch('/api/permissions/' + type + '/' + rid + '/' + uid, {
      method: 'DELETE', headers: { 'Authorization': 'Bearer ' + bearerToken }
    });
    loadPermissions(type, rid);
  } catch (e) {}
}

function renderExecHistory() {
  const output = document.getElementById('agent-output');
  if (!output || !executionHistory.length) return;
  output.style.display = 'block';
  output.innerHTML = executionHistory.map(e => {
    const statusIcon = e.status === 'running' ? '⏳' : e.status === 'completed' ? '✅' : e.status === 'error' ? '❌' : '⏹';
    const time = e.created_at ? new Date(e.created_at).toLocaleTimeString() : '';
    const preview = e.prompt ? e.prompt.substring(0, 60) : '';
    return '<div style="padding:4px 0;border-bottom:1px solid #21262d;cursor:pointer" onclick="showExecution(\'' + e.id + '\')">'
      + statusIcon + ' <b>' + esc(e.agent_type || '') + '</b> '
      + '<span style="color:#8b949e">' + esc(preview) + '</span>'
      + '<span style="float:right;font-size:0.7em;color:#484f58">' + time + '</span>'
      + '</div>';
  }).join('');
}

function showExecution(execID) {
  const e = executionHistory.find(x => x.id === execID);
  if (!e) return;
  const output = document.getElementById('agent-output');
  output.innerHTML = '<div style="color:#58a6ff;margin-bottom:6px">Prompt: ' + esc(e.prompt || '') + '</div>';
  if (e.messages && e.messages.length) {
    e.messages.forEach(m => {
      if (m.type === 'tool_use' || m.msg_type === 'tool_use') {
        output.innerHTML += '<div style="color:#d2a8ff">[' + (m.tool_name || 'tool') + '] ' + esc(m.tool_input || '') + '</div>';
      } else if (m.content) {
        output.innerHTML += '<div style="color:#c9d1d9">' + esc(m.content) + '</div>';
      }
    });
  } else if (e.status === 'running') {
    output.innerHTML += '<div style="color:#8b949e;font-style:italic">Running... messages will appear as they arrive.</div>';
  }
  output.scrollTop = output.scrollHeight;
  currentExecId = execID;
}

// Handle agent messages from WebSocket
function handleAgentMessage(msg) {
  const output = document.getElementById('agent-output');
  if (!output) return;

  if (msg.type === 'agent_session_created') {
    document.getElementById('agent-session-id').value = msg.session_id;
    if (msg.exec_id) currentExecId = msg.exec_id;
    return;
  }
  if (msg.type === 'agent_error') {
    output.style.display = 'block';
    output.innerHTML += '<div style="color:#f85149">[ERROR] ' + esc(msg.error) + '</div>';
    document.getElementById('agent-status').textContent = 'Error';
    if (currentExecId) {
      const e = executionHistory.find(x => x.id === currentExecId);
      if (e) { e.status = 'error'; e.error = msg.error; }
    }
    return;
  }
  if (msg.type === 'agent_message') {
    output.style.display = 'block';
    if (currentExecId) {
      const e = executionHistory.find(x => x.id === currentExecId);
      if (e) {
        if (!e.messages) e.messages = [];
        e.messages.push({ type: msg.msg_type, content: msg.content, tool_name: msg.tool_name, tool_input: msg.tool_input });
      }
    }
    // Show live output if we're viewing this execution or no specific exec selected
    if (!currentExecId || msg.exec_id === currentExecId) {
      if (msg.msg_type === 'tool_use') {
        output.innerHTML += '<div style="color:#d2a8ff">[' + (msg.tool_name || 'tool') + '] ' + esc(msg.tool_input || '') + '</div>';
      } else if (msg.content) {
        output.innerHTML += '<div style="color:#c9d1d9">' + esc(msg.content) + '</div>';
      }
    }
    if (msg.is_final) {
      document.getElementById('agent-status').textContent = 'Done';
      if (currentExecId) {
        const e = executionHistory.find(x => x.id === currentExecId);
        if (e) e.status = 'completed';
      }
    }
    output.scrollTop = output.scrollHeight;
  }
}

async function doCreate(type, parentId) {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) return;
  const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + bearerToken };

// ── Session Rendering ──
function render() {
  let list = Object.values(sessions);

  // Filter by selected story (single session view)
  if (selectedStoryId && hierarchy) {
    for (const ws of hierarchy.workspaces || []) {
      for (const proj of ws.projects || []) {
        for (const topic of proj.topics || []) {
          for (const story of topic.stories || []) {
            if (story.id === selectedStoryId && story.session_key) {
              list = list.filter(s => s.session_key === story.session_key);
            }
          }
        }
      }
    }
  }

  // Filter by selected topic: match sessions linked to stories in this topic
  if (selectedTopicId && hierarchy) {
    const topicSessionKeys = new Set();
    for (const ws of hierarchy.workspaces || []) {
      for (const proj of ws.projects || []) {
        for (const topic of proj.topics || []) {
          if (topic.topic.id === selectedTopicId) {
            for (const story of topic.stories || []) {
              if (story.session_key) topicSessionKeys.add(story.session_key);
            }
          }
        }
      }
    }
    // Also include sessions whose story_id maps to this topic
    if (topicSessionKeys.size > 0) {
      list = list.filter(s => topicSessionKeys.has(s.session_key));
    } else {
      list = [];
    }
  }

  if (currentFilter !== 'all') list = list.filter(s => s.status === currentFilter);
  list.sort((a, b) => b.last_event_time_ms - a.last_event_time_ms);
  document.getElementById('sess-count').textContent = list.length + ' sessions';

  const container = document.getElementById('cards-container');
  if (list.length === 0) {
    container.innerHTML = '<div class="empty-state">No sessions in this view</div>';
    return;
  }

  container.innerHTML = list.map(s => renderSessionCard(s)).join('');
}

function renderSessionCard(s) {

  const hasTurns = s.turns && s.turns.length > 0;

    + '<div class="card-header" onclick="toggleCard(\'' + key + '\')">'
    + '<span class="card-agent">' + esc(s.agent_type) + '</span>'
    + '<span class="card-title">' + esc(s.session_title || s.agent_session_id) + '</span>'

    + '<span class="badge badge-' + s.status + '">' + s.status + '</span>'
    + (s.last_hook_event ? '<span class="badge badge-event">' + esc(s.last_hook_event) + '</span>' : '')
    + '<span>' + (s.terminal || '-') + '</span>'
    + '<span>CPU ' + (s.cpu_percent ? s.cpu_percent.toFixed(1) + '%' : '-') + '</span>'
    + '<span>MEM ' + (s.memory_mb ? s.memory_mb.toFixed(0) + 'MB' : '-') + '</span>'
    + '<span>T' + (s.turn_count || 0) + '</span>'

    + '<div class="card-body' + open + '" data-session="' + key + '">'
    + '<div class="info-grid">'
    + '<div class="info-item"><span class="info-key">Session</span><span class="info-val">' + esc(trunc(s.agent_session_id, 12)) + '</span></div>'

    + '<div class="info-item"><span class="info-key">Terminal</span><span class="info-val">' + esc(s.terminal || '-') + '</span></div>'
    + '<div class="info-item"><span class="info-key">CWD</span><span class="info-val">' + esc(trunc(s.cwd, 30)) + '</span></div>'
    + '<div class="info-item"><span class="info-key">Turns</span><span class="info-val">' + (s.turn_count || 0) + '</span></div>'

    + '<button onclick="sendInput(\'' + key + '\')">Send</button>'
    + '</div>'
    + '</div></div>';

// ── Timeline (reused) ──
function renderTimeline(turns, key) {
  if (!turns || !turns.length) return '';
  let html = '<div class="timeline">';
  [...turns].reverse().forEach((turn, ri) => {
    const ti = turns.length - 1 - ri;
    const turnId = key + '_turn_' + ti;
    const isNewest = ri === 0;
    if (!(turnId in expandedTurns)) expandedTurns[turnId] = isNewest;
    const isOpen = expandedTurns[turnId];
    html += '<div class="tl-turn">';
    html += '<div class="tl-turn-header" onclick="event.stopPropagation();toggleTurn(\'' + key + '\',' + ti + ')">';
    html += '<span class="tl-arrow' + (isOpen ? ' open' : '') + '">▶</span> ';
    html += '<span class="tl-turn-badge">Turn ' + (turn.turn_idx + 1) + '</span>';
    if (turn.user_input) html += '<span style="color:#8b949e">|</span><span>' + esc(trunc(turn.user_input, 40)) + '</span>';
    if (turn.user_ts) html += '<span class="tl-time">' + esc(formatTime(turn.user_ts)) + '</span>';
    html += '</div>';
    html += '<div class="tl-turn-body' + (isOpen ? ' open' : '') + '">';
    if (turn.user_input) {
      html += '<div class="tl-entry"><div class="tl-entry-header"><span class="tl-label">User Input</span><span class="tl-time">' + esc(formatTime(turn.user_ts)) + '</span></div><div class="tl-user-text">' + esc(turn.user_input) + '</div></div>';
    }
    turn.entries.forEach((entry, ei) => {
      const tools = entry.tools;
      const hasTools = tools && tools.length > 0;
      const payloadId = key + '_' + ti + '_' + ei;
      const payloadOpen = expandedPayloads[payloadId];
      const payloadText = formatPayloadDisplay(entry.payload, entry.event);
      html += '<div class="tl-entry">';
      html += '<div class="tl-entry-header"><span class="tl-label">' + esc(entry.event) + '</span>';
      if (hasTools) html += '<span class="tl-tool-count">(' + tools.length + ' tools)</span>';
      html += '<span class="tl-time">' + esc(formatTime(entry.start_ts || entry.ts)) + '</span></div>';
      if (hasTools) {
        const tgOpen = expandedToolGroups[payloadId];
        html += '<div class="tl-tool-group-header" onclick="event.stopPropagation();toggleToolGroup(\'' + key + '\',' + ti + ',' + ei + ')">';
        html += '<span class="tl-arrow' + (tgOpen ? ' open' : '') + '">▶</span>';
        html += '<span style="font-size:0.75em;color:#c9d1d9">' + esc(tools.map(t => t.name).join(', ')) + '</span></div>';
        html += '<div class="tl-tools' + (tgOpen ? ' open' : '') + '">';
        tools.forEach(tc => {
          html += '<div class="tl-tool"><div class="tl-tool-head"><span class="tl-tool-name">' + esc(tc.name) + '</span><span class="tl-tool-status ' + esc(tc.status) + '">' + esc(tc.status) + '</span><span class="tl-time">' + esc(formatTime(tc.start_ts)) + '</span></div>';
          if (tc.input) html += '<div class="tl-tool-input">in: ' + esc(trunc(tc.input, 120)) + '</div>';
          if (tc.output) html += '<div class="tl-tool-output">out: ' + esc(trunc(tc.output, 200)) + '</div>';
          html += '</div>';
        });
        html += '</div>';
      }
      if (payloadText && payloadText !== entry.event) {
        html += '<div class="tl-payload-toggle" onclick="event.stopPropagation();toggleEntryPayload(\'' + key + '\',' + ti + ',' + ei + ')"><span class="tl-arrow' + (payloadOpen ? ' open' : '') + '">▶</span> Payload</div>';
        html += '<div class="tl-payload-body' + (payloadOpen ? ' open' : '') + '"><pre>' + esc(payloadText) + '</pre></div>';
      }
      html += '</div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

// ── Helpers ──
function toggleCard(key) { expandedCards[key] = !expandedCards[key]; render(); }
function toggleToolGroup(key, ti, ei) { const id = key + '_' + ti + '_' + ei; expandedToolGroups[id] = !expandedToolGroups[id]; render(); }
function toggleEntryPayload(key, ti, ei) { const id = key + '_' + ti + '_' + ei; expandedPayloads[id] = !expandedPayloads[id]; render(); }
function toggleTurn(key, ti) { const id = key + '_turn_' + ti; expandedTurns[id] = !expandedTurns[id]; render(); }
function togglePayload(key) { const el = document.querySelector('[data-payload="' + key + '"]'); if (el) el.classList.toggle('open'); }

function sendInput(key) {
  const input = document.getElementById('input-' + key);
  if (!input || !ws || ws.readyState !== WebSocket.OPEN) return;
  const text = input.value.trim();
  if (!text) return;
  ws.send(JSON.stringify({ type: 'send_input', session_key: key, text }));
  input.value = '';
}

function formatTime(ms) { if (!ms) return ''; return new Date(ms).toLocaleTimeString('en-US', { hour12: false }); }
function esc(s) { if (!s && s !== 0) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function trunc(s, m) { if (!s) return '-'; return s.length > m ? s.slice(0, m) + '...' : s; }

function formatPayload(p) {
  if (!p || p === 'null') return '';
  try { return JSON.stringify(typeof p === 'string' ? JSON.parse(p) : p, null, 2); }
  catch (_) { return String(p); }
}

function formatPayloadDisplay(payload, eventName) {
  if (!payload || payload === 'null') return eventName;
  try {
    const data = typeof payload === 'string' ? JSON.parse(payload) : payload;
    const cleaned = { ...data };
    delete cleaned.daemon_token;
    delete cleaned._role;
    return JSON.stringify(cleaned, null, 2);
  } catch (_) { return eventName; }
}

// ── Init ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

const savedToken = localStorage.getItem('bearer_token');
const savedUser = localStorage.getItem('current_user');
if (savedToken && savedUser) {
  bearerToken = savedToken;
  try { currentUser = JSON.parse(savedUser); } catch (e) { currentUser = null; }
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-name').textContent = currentUser ? currentUser.username : 'User';
  connectWS();
} else {
  renderAuth('login');
}
</script>
